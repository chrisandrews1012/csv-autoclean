[project]
name = "csv-autoclean"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chrisandrews1012", email = "171823942+chrisandrews1012@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
csv-autoclean = "csv_autoclean:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
